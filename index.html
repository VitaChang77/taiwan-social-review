</style></head><body><header><div class="inner"><span class="tag heroTag">康軒五年級上學期社會・持續擴充</span><h1>🧭 臺灣探索隊</h1><p class="subtitle">先理解，再練習，最後挑戰正式考試！</p></div></header><main class="wrap"><div class="tabs" id="tabs"><button data-page="home" class="active">🏠 首頁</button><button data-page="learn">📚 複習</button><button data-page="practice">✍️ 練習</button><button data-page="exam">📝 考試</button><button data-page="history">📊 成績</button></div><div id="app"></div><div class="foot">依提供之課本照片編寫原創摘要與題目；非康軒官方網站。資料儲存在目前瀏覽器的本機空間。版本 v1.5｜累積 56 張不重複課本照片，複習內容持續整理，後續可持續擴充。</div></main><script>
const topics=[
{id:'position',title:'臺灣在哪裡？',emoji:'🌏',summary:'臺灣位於亞洲東部、太平洋西側。可以用大洲、海洋、鄰國和海域，清楚描述臺灣的位置。',facts:['從世界地圖看：臺灣在亞洲東部，太平洋西側。','臺灣東邊是太平洋，西邊隔著臺灣海峽與中國相望。','臺灣南邊與菲律賓之間隔著巴士海峽；東北邊附近有日本，北方海域有東海。','描述相對位置時，要說清楚「什麼地方在臺灣的哪個方向」。'],memory:'東太平洋、西臺灣海峽、南巴士海峽、北東海。',cards:[['臺灣位於哪一洲的東部？','亞洲。'],['臺灣的東邊是什麼海洋？','太平洋。'],['臺灣海峽位於臺灣的哪一邊？','西邊，隔著臺灣海峽與中國相望。'],['臺灣和菲律賓之間隔著什麼海峽？','巴士海峽。'],['臺灣北邊主要是哪個海域？','東海。']]},
{id:'transport',title:'為什麼交通位置重要？',emoji:'✈️',summary:'臺灣介於東北亞與東南亞之間，是重要的海空交通往來地點。國際航線會帶來交流與經濟活動。',facts:['臺灣的地理位置有利於與日本、韓國、菲律賓、新加坡等地交流。','許多國際航空路線經過臺灣附近或上空；經核准使用臺灣提供的航路服務，可能產生過境航路服務費。','即使飛機沒有在臺灣降落，使用相關飛航服務也可能需要付費。','課本統計圖顯示：2017～2023 年中，2019 年最高（24.1 億元），2021 年最低（6.4 億元）；2020～2021 年明顯下降，隨後回升。'],memory:'位置重要→交通往來→服務收入；讀圖先看年份、單位與最高最低。',cards:[['飛機沒有在臺灣降落，是否一定不用付過境航路服務費？','不一定。若使用臺灣提供的相關航路服務，仍可能需要付費。'],['課本統計圖中收入最高是哪一年？','2019 年，24.1 億元。'],['課本統計圖中收入最低是哪一年？','2021 年，6.4 億元。'],['臺灣位於哪兩個亞洲區域之間？','東北亞與東南亞。']]},
{id:'islands',title:'臺灣不只有臺灣島',emoji:'🏝️',summary:'臺灣包含臺灣島與周邊多個島嶼，例如澎湖、金門、馬祖、綠島、蘭嶼、小琉球、龜山島及南海諸島等。',facts:['澎湖群島位於臺灣海峽。','金門列嶼、馬祖列嶼位於臺灣海峽西側、靠近中國沿岸。','綠島、蘭嶼在臺灣東南方外海；龜山島位於宜蘭東方海面。','小琉球位於臺灣西南方的臺灣海峽。','南海諸島包含東沙、西沙、中沙和南沙群島；地圖所示地理範圍不代表各群島均由臺灣實際管轄。'],memory:'澎湖在海峽；綠島蘭嶼在東南；龜山島在宜蘭外海。',cards:[['澎湖群島位於哪裡？','臺灣海峽。'],['從宜蘭向海上看，可能看見哪座像烏龜的島？','龜山島。'],['綠島與蘭嶼主要位於臺灣哪一側？','東南方外海。'],['金門、馬祖位於臺灣海峽的哪一側？','西側，靠近中國沿岸。']]},
{id:'culture',title:'海洋如何影響文化？',emoji:'🌊',summary:'臺灣四面環海。過去沿海居民利用海洋資源，發展漁撈活動，也形成獨特的文化與信仰。',facts:['海女：早期部分沿海居民下海採集海菜、海膽等水產；如今仍可透過文化保存認識這種生活方式。','牽罟：許多人合作將漁網圍住魚群，再從岸上拉網，體現合作與分享精神。','牽罟從傳統捕魚活動逐漸轉為文化體驗與觀光活動。','海洋相關信仰包含媽祖信仰；達悟族的拼板舟與祭儀和海洋生活密切相關。','傳統文化值得保存，因為能理解先民生活與地方特色。'],memory:'海女＝採集；牽罟＝合作拉網；媽祖／拼板舟＝海洋文化。',cards:[['海女通常從海中採集什麼？','例如海菜、海膽等水產。'],['牽罟最重要的合作過程是什麼？','集結眾人，合作圍魚、拉網。'],['牽罟現在有什麼新的用途？','文化體驗與觀光休閒活動。'],['拼板舟和臺灣哪個原住民族的傳統文化有關？','達悟族。'],['海洋生活常見的民間信仰例子？','媽祖信仰。']]},
{"id": "migration", "title": "移民如何豐富臺灣文化？", "emoji": "🤝", "summary": "臺灣四面環海，與世界交流。原住民族、早期移居的漢人，以及來自世界各地的新住民，共同形成多元文化。", "facts": ["臺灣的多元文化與長期的海上交流和人口移動有關。", "新住民帶來各自的飲食、語言、節慶與生活習慣，豐富臺灣社會。", "政府將每年12月18日訂為「移民節」，提醒大眾尊重並關懷新住民。", "移民節可舉辦文化表演、美食體驗等活動，促進不同族群相互認識與尊重。", "不要把族群文化的不同視為優劣；互相理解、平等對待很重要。"], "memory": "12月18日＝移民節；文化交流＝彼此尊重。", "cards": [["移民節是哪一天？", "每年12月18日。"], ["為什麼臺灣文化很多元？", "不同時期、不同來源的人們一起生活，帶來各自文化。"], ["移民節會有哪些活動？", "文化表演、美食體驗、族群交流等。"], ["碰到不同的飲食文化應該怎麼做？", "抱持尊重與好奇心，不嘲笑、不歧視。"]]},{"id": "religion", "title": "宗教信仰如何影響行為？", "emoji": "🕊️", "summary": "宗教信仰通常有規範與教導，鼓勵信徒修身養性、行善、尊重他人，對社會秩序產生影響。", "facts": ["宗教信仰除了儀式，也可能教導人行善、關心他人與自我約束。", "部分民間信仰強調善有善報、惡有惡報，提醒人不要做壞事。", "基督宗教常以「愛人如己」教導信徒關懷、包容他人。", "不同信仰有不同實踐方式；尊重宗教自由，不能強迫別人接受自己的信仰。", "社會秩序也需要法律與共同規範，不能只靠宗教。"], "memory": "信仰規範→約束行為、鼓勵行善；不同信仰→互相尊重。", "cards": [["宗教信仰可能如何影響個人行為？", "引導人行善、自我約束、尊重他人。"], ["「愛人如己」強調什麼？", "像關愛自己一樣關愛他人。"], ["不同宗教的人應如何相處？", "尊重宗教自由及彼此的選擇。"]]},{"id": "norms", "title": "社會規範為什麼會改變？", "emoji": "⚖️", "summary": "社會規範會隨時代、價值觀和生活需求改變。尊重彼此、追求平等，才能讓社會更公平。", "facts": ["有些舊習俗在時代改變後，會被重新討論與調整。", "早期部分人避開農曆七月結婚，現在也有人不再介意。", "過去有些地方只慶祝男孩滿月，現今男女孩都能平等接受祝福。", "社會規範調整時，既要尊重個人選擇，也要考慮他人的權利與社會秩序。", "判斷習俗時，重點是理解與尊重，而非嘲笑過去的做法。"], "memory": "觀念會變；尊重、平等、互相體諒是重點。", "cards": [["為什麼社會規範會改變？", "因社會價值觀、生活方式與需求隨時間改變。"], ["以前與現在對農曆七月結婚的看法有何不同？", "過去較常避開，如今有些人不再介意。"], ["男女孩滿月都應受到祝福，強調哪種觀念？", "性別平等與尊重。"]]}
,
{"id": "social", "title": "社會規範讓生活更有秩序", "emoji": "🚏", "summary": "社會規範是大家認可的行為準則，包括風俗習慣、宗教信仰、倫理道德與法律。", "facts": ["排隊是大家共同遵守的社會規範，可減少衝突。", "風俗習慣與倫理道德通常靠認同、尊重及勸導維持；法律具有國家強制力。", "社會規範能引導個人與群體行為，維持秩序，並可能隨時代改變。"], "memory": "想想公車排隊：先來後到、尊重別人。", "cards": [["社會規範包括哪些？", "風俗習慣、宗教信仰、倫理道德與法律。"], ["排隊的目的？", "避免插隊爭執、維護公平與秩序。"]]},
{"id": "customs", "title": "風俗習慣與倫理道德", "emoji": "🫶", "summary": "節慶、成年禮等風俗使人凝聚；孝順、關懷、禮讓等倫理道德幫助人和睦相處。", "facts": ["中秋團圓、阿美族豐年祭都是文化生活的例子。", "生命禮俗和節慶活動能凝聚群體情感與歸屬感。", "在大眾運輸上主動關心需要座位的乘客，是體貼與倫理道德的表現。", "優先席應依實際需要禮讓，不只看年齡或外表。"], "memory": "有需要就關心：不只看年齡、也不要只顧自己。", "cards": [["生命禮俗是什麼？", "透過儀式或活動，為出生、成年、婚姻等人生階段祈求平安順利。"], ["優先席如何使用？", "依乘客實際需求禮讓，友善溝通。"]]},
{"id": "law", "title": "法律保障安全，也規範行為", "emoji": "⚖️", "summary": "法律由政府制定，人人都應遵守，具有強制力，目的在保障權益和維護公共秩序。", "facts": ["法律有保障與限制兩面，為避免傷害他人的權利而適度約束行為。", "行人遵守號誌與行穿線、騎機車戴安全帽都是交通安全規範。", "深夜噪音可能影響他人安寧，應先合理溝通，違規時可能依法處理。", "違法可能受到罰款或刑罰等不同處置，不能把所有違規都說成要坐牢。"], "memory": "法律不是只會處罰；遵守法律才能保護大家。", "cards": [["法律和其他規範最大的不同？", "法律具有國家強制力。"], ["深夜大聲喧譁應如何處理？", "尊重鄰居休息、理性溝通，必要時依法處理。"]]},
{"id": "rights", "title": "法律保障兒少與多元語言", "emoji": "🛡️", "summary": "兒童和少年有受照顧、保護與發展的權利，不同語言與文化也應受到尊重。", "facts": ["兒童及少年福利與權益保障法重視兒少身心健康、照顧與保護。", "課本將未滿12歲者稱兒童，12歲以上未滿18歲者稱少年。", "課本舉例：未滿18歲不得飲酒，商家不得販售酒類給未成年人。", "國家語言發展法促進不同語言的傳承與使用，包含臺灣手語。", "公共空間提供多語言標示或服務，可保障更多人平等取得資訊。"], "memory": "保護兒少、尊重語言，讓每個人都有安心生活的機會。", "cards": [["未滿幾歲不能購買酒？", "未滿18歲。"], ["為什麼有多語言服務？", "讓不同語言使用者能理解資訊、受到尊重。"]]},
{"id": "online", "title": "網路世界也要守法與防詐", "emoji": "🔐", "summary": "網購防詐、引用圖片標示來源、取得他人同意再分享照片，都是數位公民的基本能力。", "facts": ["遇到價格異常低廉、要求急著匯款的購物資訊，要先查證賣家可信度。", "使用網路文字、照片、影音時須尊重著作權；只標註來源或寫「教學用」不代表一定可以任意使用。", "公開分享可辨認他人的照片前，先取得對方同意並注意隱私。", "造謠、侮辱或散布他人隱私，可能傷害人，也可能觸犯法律。", "若遇到可疑購物資訊，可向家長、老師求助，避免點擊不明連結或匯款。"], "memory": "網路三先：先查證、先徵詢同意、先確認使用授權。", "cards": [["便宜到不合理的購物優惠？", "先查證網站、評價與付款方式，不急著匯款。"], ["標註來源就能隨便用圖片嗎？", "不一定，仍要確認著作權及授權條件。"], ["能隨意上傳同學的合照嗎？", "應先取得同學同意並保護個人隱私。"]]}

{"id": "tectonic", "title": "板塊運動與臺灣地形", "emoji": "⛰️", "summary": "臺灣位於歐亞板塊與菲律賓海板塊的交界，板塊長期擠壓造成山地隆起，也使地震頻繁。", "facts": ["地球表面有許多板塊；臺灣位在歐亞板塊與菲律賓海板塊交界。", "板塊碰撞、擠壓使地形隆起，形成許多山脈，也容易發生地震。", "1999年9月21日發生九二一大地震；部分地形與建築受到影響。", "臺灣島南北狹長、東西窄；中央山脈等山地大致南北走向。", "河川多從中央山地往東、西流向海洋。"], "memory": "兩大板塊擠壓→山脈隆起、地震頻繁；921＝1999年9月21日。", "cards": [["臺灣在哪兩個板塊交界？", "歐亞板塊與菲律賓海板塊。"], ["臺灣為何多山又常地震？", "因板塊長期碰撞擠壓。"], ["九二一大地震是哪一年？", "1999年。"], ["臺灣山脈大致朝哪個方向延伸？", "南北走向。"]]},
{"id": "landforms", "title": "五大地形與地圖判讀", "emoji": "🗺️", "summary": "臺灣主要地形包括平原、盆地、台地、丘陵與山地；分布與地勢高低影響土地利用和人口聚集。", "facts": ["平原：地勢平坦、面積較廣；盆地：四周較高、中間較低且較平坦。", "台地：地勢較高、頂部較平坦；丘陵：高低起伏，通常比山地低；山地：地勢高、起伏大。", "臺灣山地多分布在中部與東部，西部常見平原與丘陵。", "臺灣地形圖中的顏色需配合圖例判讀，不能只憑顏色猜地名。", "臺灣的地形包括臺北盆地、桃園台地、嘉南平原、竹東丘陵、中央山脈、玉山山脈等。"], "memory": "平原平廣、盆地四周高、台地頂平、丘陵起伏、山地高陡。", "cards": [["哪一種地形四周較高、中間較低？", "盆地。"], ["哪種地形地勢較高但頂部平坦？", "台地。"], ["臺灣山地主要集中在哪些區域？", "中部與東部。"], ["比較地形在地圖上的分布應先看什麼？", "圖例及方向。"]]},
{"id": "plains", "title": "平原、盆地、台地的生活變化", "emoji": "🏙️", "summary": "平坦土地易於農耕、交通與建設；臺北盆地由農業轉為人口密集都市，桃園台地的埤塘使用也隨發展而變。", "facts": ["平原、盆地與台地因地勢較平坦，較方便農耕、建築與交通，人口常較密集。", "臺北盆地早期有農業活動，後因交通、政策和產業發展形成繁榮都市。", "桃園台地早期居民興築埤塘儲存雨水灌溉農田。", "埤塘在乾旱時水量可能不足；隨工商業與都市發展，有些埤塘被填平，也有些改建為休憩生態空間。", "桃園國際機場擴建也曾利用填平部分埤塘取得土地。"], "memory": "平地易開發；臺北盆地：農田→都市；桃園台地：埤塘灌溉→部分轉作其他用途。", "cards": [["臺北盆地早期主要的經濟活動？", "農業。"], ["桃園台地早期埤塘有什麼用途？", "儲水與灌溉。"], ["為什麼平原常有密集住宅？", "土地相對平坦，方便建築、農耕和交通。"], ["埤塘現在可能轉變成什麼？", "生態公園、休閒空間等。"]]},
{"id": "hills_rivers", "title": "丘陵、山地與河川水庫的生活", "emoji": "💧", "summary": "丘陵、山地與河川孕育多樣的產業與生態，但開發必須兼顧水資源與環境保護。", "facts": ["丘陵坡地可依條件發展茶園、果園；竹東丘陵早期有茶樹種植，部分地區後來發展教育及高科技產業。", "高山林地早期曾伐木，現今更強調森林保育、休閒與生態旅遊；仙山曾是林業活動區域。", "臺灣河川多發源於山地，流程通常較短、流速較快，降雨季節分布不均，易造成枯水期缺水。", "河川可提供灌溉、生活與工業用水；水庫可調節供水，但也會改變原有環境與聚落。", "翡翠水庫蓄水後，原範圍內部分聚落遭淹沒；也能提供臺北市及周邊地區用水。", "颱風或豪雨可能增加河川水量，需兼顧水資源利用及防災。"], "memory": "丘陵茶園果園；山地森林保育；河川短急、水量不均；水庫供水也改變環境。", "cards": [["竹東丘陵早期常見哪項農業？", "茶葉栽種與採收。"], ["臺灣河川有什麼常見特色？", "短、流急，水量受季節降雨影響大。"], ["興建水庫的主要用途？", "蓄水、調節供水。"], ["水庫對原本聚落有什麼可能影響？", "淹沒原本土地與聚落，居民可能需要搬遷。"], ["現今山地發展為何要重視森林保護？", "保護生態環境與水土資源。"]]},
{"id": "river_coast", "title": "河川下游與海岸的土地利用", "emoji": "🏞️", "summary": "河川下游地勢平坦，常見農田、聚落、工廠與交通設施；河口和海岸也有不同的利用方式。", "facts": ["河川下游流速通常比上游慢，地勢比較平坦，聚落與各種產業較容易發展。", "立霧溪下游附近可見農田、工廠與聚落；高屏溪下游有農田、魚塭、工業區及住宅。", "使用河川下游土地時，也要顧及水質、洪水和環境保護。", "臺灣北部海岸有較多岩岸與岬角、海灣；西部海岸常見沙岸、沙洲與潮間帶。", "沙岸可能發展養殖漁業、鹽業與漁港；海岸也可發展觀光，但需顧及生態。"], "memory": "河川下游地平、用途多；海岸形態不同，土地利用也不同。", "cards": [["河川下游為何常有聚落？", "地勢較平坦，交通與土地利用較方便。"], ["高屏溪下游有哪些土地利用？", "農田、魚塭、工業區與聚落等。"], ["臺灣西部海岸常見哪一種海岸？", "沙岸及沙洲。"], ["北部海岸有什麼特色？", "可見岬角、海灣等岩岸地形。"]]},
{"id": "coastal_change", "title": "海岸產業與環境變遷", "emoji": "🐟", "summary": "海岸地形、海洋資源和科技發展共同影響居民產業，從捕魚、養殖到工業、旅遊都可能出現。", "facts": ["早期沿海居民可能從事漁業、曬鹽與養殖。", "海岸交通設施及港口可促進漁業、貿易與運輸。", "彰化縣芳苑鄉王功一帶有養殖漁業與潮間帶特色。", "有些岬角、海灣可以建港；例如小型港口為漁船提供停泊之處。", "東部海岸受山脈靠近海邊影響，部分地區腹地較狹窄，交通建設不易。"], "memory": "海岸看地形選用途：漁港、養殖、交通、觀光，都要注意生態。", "cards": [["芳苑王功常見哪種產業？", "養殖漁業。"], ["漁港主要提供什麼功能？", "漁船停泊、漁獲運輸等。"], ["東部海岸部分地區為何鐵路建設較困難？", "山地靠近海岸，平坦腹地狹窄。"]]},
{"id": "climate", "title": "臺灣氣候、颱風與降雨", "emoji": "🌦️", "summary": "臺灣受地理位置與季風、颱風影響，降雨量及分布因地區與季節而不同。", "facts": ["臺灣位在熱帶與副熱帶附近，氣候受到緯度、海洋、季風及地形影響。", "夏秋常有颱風帶來強風與豪雨，可能造成災害，也可能補充水庫水量。", "圖表中臺灣各月平均降雨量並非相同；比較時需先看月份和雨量單位。", "颱風經過後，不同地區的水庫蓄水情況不同，並非都相同。", "2024 年凱米颱風對臺灣各地降雨與水庫蓄水帶來影響，教材以地圖與百分比呈現。"], "memory": "地理位置＋季風＋地形＝各地氣候差異；颱風有補水也有災害。", "cards": [["颱風可能帶來哪些影響？", "強風、豪雨及災害，也可能增加水庫蓄水。"], ["比較降雨量長條圖應看什麼？", "橫軸月份、縱軸雨量單位與柱高。"], ["臺灣各地颱風過後的蓄水率一定相同嗎？", "不一定，會因降雨分布與水庫條件不同。"]]},
{"id": "monsoon_life", "title": "季風與適應多雨的生活", "emoji": "🌬️", "summary": "東北季風與西南季風風向不同；人們因應多雨環境設計建築、衣物、設備與生活方式。", "facts": ["冬季東北季風主要從東北方向吹來，迎風面的北部、東北部容易多雨。", "夏季西南季風從西南方吹來，可為臺灣中南部等地帶來水氣與降雨。", "風力發電機會依風向調整迎風方向，臺灣沿岸可利用風力發電。", "傳統建築有斜屋頂與瓦片，幫助雨水快速滑落。", "多雨地區的公共空間常有遮雨棚、雨遮，現代也有屋頂防水與綠屋頂等做法。"], "memory": "冬東北、夏西南；多雨需排水、防水、遮雨。", "cards": [["冬季常見什麼季風？", "東北季風。"], ["夏季常見什麼季風？", "西南季風。"], ["斜屋頂對多雨氣候有什麼幫助？", "有利雨水滑落。"], ["綠屋頂可能有什麼效益？", "協助雨水管理、隔熱及改善環境。"]]}

let state={page:'home',topicIndex:0,flashIndex:0,revealed:false,session:null};const KEY='tw_social_v1';const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{"records":[],"mistakes":{}}')}catch{return {records:[],mistakes:{}}}};const save=d=>localStorage.setItem(KEY,JSON.stringify(d));const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function go(page){state.page=page;state.session=null;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'});}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.page));function render(){if(state.page==='home')home();if(state.page==='learn')learn();if(state.page==='practice')setup('practice');if(state.page==='exam')setup('exam');if(state.page==='history')history();}
function home(){const d=saved(),last=d.records.at(-1);app.innerHTML=`<div class="card"><span class="tag">持續更新・累積複習</span><h2>今天的任務：認識臺灣 🌟</h2><p>先讀各主題重點，再做練習題；準備好後，挑戰正式考試。</p><div class="statgrid"><div class="stat"><strong>${topics.length}</strong><span class="small">複習主題</span></div><div class="stat"><strong>${Q.length}</strong><span class="small">題庫題目</span></div><div class="stat"><strong>${d.records.length}</strong><span class="small">完成考試</span></div></div>${last?`<p class="muted">上次考試：${last.correct}/${last.total} 題答對（${Math.round(last.correct/last.total*100)} 分）</p>`:''}<div class="actions"><button onclick="go('learn')">開始複習</button><button class="secondary" onclick="go('exam')">直接考試</button></div></div><h3>這次要掌握的重點</h3>${topics.map((t,i)=>`<div class="card topic"><span class="tag">主題 ${i+1}</span><h3>${t.emoji} ${t.title}</h3><p>${t.summary}</p><button class="secondary" onclick="state.topicIndex=${i};state.flashIndex=0;state.revealed=false;go('learn')">複習這個主題</button></div>`).join('')}`;}
function learn(){const t=topics[state.topicIndex],c=t.cards[state.flashIndex];app.innerHTML=`<div class="card"><span class="tag">複習模式 ${state.topicIndex+1} / ${topics.length}</span><h2>${t.emoji} ${t.title}</h2><p>${t.summary}</p>${t.facts.map(x=>`<p>✅ ${esc(x)}</p>`).join('')}<div class="note">💡 <b>快速記憶：</b>${t.memory}</div></div><div class="card"><h3>翻卡記憶（${state.flashIndex+1} / ${t.cards.length}）</h3><div class="flash"><h3>${esc(c[0])}</h3>${state.revealed?`<div class="answer">${esc(c[1])}</div>`:'<p class="muted">先自己想答案，再按「看答案」</p>'}</div><div class="actions"><button onclick="state.revealed=!state.revealed;learn()">${state.revealed?'隱藏答案':'看答案'}</button><button class="secondary" onclick="state.flashIndex=(state.flashIndex+1)%topics[state.topicIndex].cards.length;state.revealed=false;learn()">下一張卡片 →</button></div></div><div class="actions"><button class="secondary" ${state.topicIndex===0?'disabled':''} onclick="state.topicIndex--;state.flashIndex=0;state.revealed=false;learn()">← 上一主題</button>${state.topicIndex<topics.length-1?`<button onclick="state.topicIndex++;state.flashIndex=0;state.revealed=false;learn()">下一主題 →</button>`:`<button onclick="go('practice')">完成！去練習 →</button>`}</div>`;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function setup(mode){app.innerHTML=`<div class="card"><span class="tag">${mode==='exam'?'正式測驗':'無壓力練習'}</span><h2>${mode==='exam'?'📝 準備挑戰考試':'✍️ 用題目練習'}</h2><p>${mode==='exam'?'正式考試會在全部作答後批改，提供成績和錯題解析；每次從題庫隨機抽題。':'每題作答後立即知道對錯、看到解說，不記入正式考試成績。'}</p><p><b>選擇範圍</b></p><select id="filter"><option value="all">所有主題</option>${topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select><p><b>題數</b></p><select id="count"><option value="10">10 題・快速練習</option><option value="20">20 題・標準測驗</option><option value="30">30 題・加強測驗</option><option value="999">全部 ${Q.length} 題・完整複習</option></select><div class="actions"><button onclick="start('${mode}')">開始${mode==='exam'?'考試':'練習'} →</button></div></div>`;}
function start(mode){let filter=document.getElementById('filter').value,count=+document.getElementById('count').value;let pool=Q.map((q,i)=>({...{q,i}})).filter(x=>filter==='all'||x.q[0]===filter);let order=shuffle(pool).slice(0,count).map(x=>x.i);state.session={mode,order,index:0,answers:{},submitted:false,filter};showQuestion();}function showQuestion(){const s=state.session;if(!s)return;const idx=s.order[s.index],q=Q[idx],ans=s.answers[idx],finished=s.mode==='practice'&&ans!==undefined;app.innerHTML=`<div class="card"><span class="tag">${s.mode==='exam'?'正式測驗':'即時練習'}・${topics.find(t=>t.id===q[0]).title}・${q[5]==='tf'?'是非題':q[5]==='scenario'?'情境題':q[5]==='map'?'圖表判讀':'選擇題'}</span><h2>第 ${s.index+1} / ${s.order.length} 題</h2><div class="progress"><div style="width:${(s.index+1)/s.order.length*100}%"></div></div><h3>${esc(q[1])}</h3>${q[2].map((c,i)=>`<button class="choice ${ans===i?'selected':''} ${finished?(i===q[3]?'good':ans===i?'bad':''):''}" ${finished?'disabled':''} onclick="answer(${i})">${q[5]==='tf'?'':('ABCD'[i]+'. ')}${esc(c)}</button>`).join('')}${finished?`<div class="feedback"><b>${ans===q[3]?'答對了！':'再記住這個重點！'}</b><br>${esc(q[4])}</div>`:''}<div class="actions"><button class="secondary" ${s.index===0?'disabled':''} onclick="step(-1)">← 上一題</button><button ${ans===undefined?'disabled':''} onclick="${s.index===s.order.length-1?'finish()':'step(1)'}">${s.index===s.order.length-1?'交卷看結果':'下一題 →'}</button></div>${s.mode==='exam'?'<p class="tiny">考試模式：交卷前不顯示正確答案。</p>':''}</div>`;}function answer(i){const s=state.session,idx=s.order[s.index];if(s.mode==='practice'&&s.answers[idx]!==undefined)return;s.answers[idx]=i;showQuestion()}function step(n){state.session.index+=n;showQuestion()}function finish(){const s=state.session;if(s.order.some(i=>s.answers[i]===undefined)){alert('還有題目尚未作答，請完成後再交卷。');s.index=s.order.findIndex(i=>s.answers[i]===undefined);showQuestion();return;}const correct=s.order.filter(i=>s.answers[i]===Q[i][3]).length;if(s.mode==='exam'){let d=saved();d.records.push({date:new Date().toLocaleString('zh-TW'),correct,total:s.order.length});d.records=d.records.slice(-30);s.order.forEach(i=>{if(s.answers[i]!==Q[i][3])d.mistakes[i]=(d.mistakes[i]||0)+1;else delete d.mistakes[i]});save(d);}let wrong=s.order.filter(i=>s.answers[i]!==Q[i][3]);app.innerHTML=`<div class="card"><span class="tag">${s.mode==='exam'?'正式測驗成績':'練習完成'}</span><h2>${correct===s.order.length?'全部答對，太厲害了！':correct/s.order.length>=.8?'挑戰成功，繼續保持！':'繼續複習，一定會進步！'}</h2><div class="score">${Math.round(correct/s.order.length*100)} <span style="font-size:20px">分</span></div><p>答對 <b>${correct}</b> / ${s.order.length} 題，答錯 <b>${wrong.length}</b> 題</p><div class="actions"><button onclick="go('learn')">回去複習</button><button class="secondary" onclick="go('${s.mode}')">再測一次</button></div></div><div class="card"><h3>📌 ${wrong.length?'錯題複習':'你已全部答對'}</h3>${wrong.length?wrong.map(i=>`<div class="reviewItem"><b>${esc(Q[i][1])}</b><p>你的答案：${esc(Q[i][2][s.answers[i]])}</p><p><b>正確答案：${esc(Q[i][2][Q[i][3]])}</b></p><p class="muted">${esc(Q[i][4])}</p></div>`).join(''):'所有題目都答對了！可以挑戰另一組隨機題目。'}</div>`;window.scrollTo({top:0,behavior:'smooth'});}function history(){let d=saved();let arr=Object.keys(d.mistakes).sort((a,b)=>d.mistakes[b]-d.mistakes[a]);app.innerHTML=`<div class="card"><h2>📊 我的考試紀錄</h2>${d.records.length?d.records.slice().reverse().map(r=>`<div class="reviewItem"><b>${Math.round(r.correct/r.total*100)} 分</b>・${r.correct}/${r.total} 題 <span class="tiny">${esc(r.date)}</span></div>`).join(''):'目前還沒有正式考試紀錄。完成一次正式考試，就能在這裡看到成績。'}</div><div class="card"><h3>📌 待加強的題目（${arr.length} 題）</h3>${arr.length?arr.map(i=>`<div class="reviewItem"><b>${esc(Q[i][1])}</b><p class="muted">${esc(Q[i][4])}</p></div>`).join(''):'暫時沒有待加強題目。'}<div class="actions"><button class="secondary" onclick="if(confirm('確定要清除本機所有測驗紀錄嗎？')){localStorage.removeItem(KEY);history()}">清除紀錄</button></div></div><p class="tiny">紀錄僅保存在這台裝置的這個瀏覽器。清除網站資料或更換裝置可能使紀錄消失。</p>`;}render();
</script></body></html>
